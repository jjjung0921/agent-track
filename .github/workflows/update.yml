name: Update and deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "site/feed.xml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A failed fetch leaves the committed data untouched, so the site still deploys with the last good data.
      - name: Fetch releases and write Korean notes
        continue-on-error: true
        run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # The previous data is the cache that keeps written Korean notes between runs.
      - name: Commit data
        run: |
          git config user.name "agent-track-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/releases.json site/feed.xml
          git diff --cached --quiet || git commit -m "data: update releases"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
