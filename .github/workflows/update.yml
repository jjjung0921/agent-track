name: Update and deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # Every push to main deploys, including the local Codex CLI routine's data/ko.json commits.
  # The bot's own data commit uses GITHUB_TOKEN, which does not start another run.
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # A failed fetch leaves the committed data untouched, so the site still deploys with the last good data.
      - name: Fetch releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/update.mjs

      # The previous data is the cache that keeps written Korean notes between runs.
      - name: Commit data
        run: |
          git config user.name "agent-track-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/releases.json site/feed.xml data/ko.json
          git diff --cached --quiet || git commit -m "data: update releases"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
